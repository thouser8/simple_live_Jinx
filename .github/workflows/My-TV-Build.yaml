# =============================================================================
#  Jinx Live —— 你自己的 Android TV 打包流程
#
#  【个性化改动怎么放】
#    两种都不碰上游文件：
#      1) 环境层面的（应用名、包名）→ 写下面 env，打包时临时改
#      2) 源码层面的功能改动 → 放 custom/patches/*.patch，第 1b 步打包时打上
#    upstream 文件在仓库里保持原样，所以每周同步永远是快进，不会冲突。
#
#  【为什么这样改名字不会被上游覆盖】
#    你的仓库里，上游文件一个字节都不改：AndroidManifest.xml 里还是
#    "Simple Live TV"，build.gradle.kts 里还是 com.xycz.simple_live_tv。
#    改名字和包名的动作，全部发生在每次打包时（下面第 2 步，临时改、只改工作区）。
#    所以：
#      · 上游更新永远碰不到这两个值 —— 它更新的文件和你仓库里的完全一致
#      · 每周同步 = 纯合并/快进，Git 没有东西可冲突
#      · 你随时改下面 env 里的两行就能换名字换包名，改完重新跑一次即可
#
#  【用法】
#    Actions → 左侧 "My TV Build (Jinx)" → Run workflow
#
#  【要改的东西都在这两行】
#    APP_LABEL : 电视桌面上显示的名字
#    APP_ID    : 安装包的唯一标识。留空 = 保持原版 com.xycz.simple_live_tv
#                填了 = 用你填的，可与官方版同时安装互不覆盖
#
#  【签名】已配好（2026-11-19）
#    Settings → Secrets and variables → Actions 里已有：
#      TV_KEYSTORE_BASE64 / TV_STORE_PASSWORD / TV_KEY_PASSWORD / TV_KEY_ALIAS
#      TV_CERT_SHA256（用来核对签名是否真的生效）
#    第 7b 步会读 APK 的实际签名证书，对不上直接失败，不会产出假成功的包。
#    密钥原件的本地备份：工作区 signing/ 目录（密钥信息与填写清单.txt）。
#
#  【出包后发邮件】2026-11-20 起
#    第 12 步用 QQ 邮箱 SMTP 把新包信息发到 MAIL_TO。
#    Settings → Secrets 里已有（不写在仓库里，公开仓库也看不到）：
#      MAIL_USERNAME  发件邮箱
#      MAIL_AUTH_CODE QQ 邮箱「授权码」，不是登录密码
#      MAIL_TO        收件邮箱
#    换邮箱只改这三个 secret，不用动这个文件。
#    邮件发失败不会让构建失败（包已经在 Releases 里了），只在日志和 Summary 里告警。
# =============================================================================
name: My TV Build (Jinx)

on:
  workflow_dispatch:
    inputs:
      source:
        description: "触发来源（同步工作流会自动填）"
        required: false
        default: "手动"

permissions:
  contents: write

env:
  APP_LABEL: "Jinx Live"
  APP_ID: "com.xycz.simple_live_tv.jinx"

jobs:
  build-tv:
    runs-on: ubuntu-latest
    # 密钥必须先在 env 里落地，不能直接写在 if: 里（GitHub 不允许 if 直接引用 secrets）
    env:
      KS: ${{ secrets.TV_KEYSTORE_BASE64 }}
      SP: ${{ secrets.TV_STORE_PASSWORD }}
      KP: ${{ secrets.TV_KEY_PASSWORD }}
      KA: ${{ secrets.TV_KEY_ALIAS }}
      MU: ${{ secrets.MAIL_USERNAME }}
      MC: ${{ secrets.MAIL_AUTH_CODE }}
      MT: ${{ secrets.MAIL_TO }}
    steps:
      - name: 1. 签出源码
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      #  应用 custom/patches 下的源码补丁
      #
      #  为什么用补丁而不是直接改源码：仓库里的 upstream 文件保持原样，
      #  每周同步永远是快进，Git 没有东西可冲突。个性化改动放在补丁里，
      #  打包时临时打到工作区。
      #
      #  上游如果重构了被补丁的文件 → 这里会明确报错并停下，
      #  不会悄悄产出一个没打到补丁的包。修复方式：按新代码重新生成补丁。
      # -----------------------------------------------------------------------
      - name: 1b. 应用本地补丁
        run: |
          set -e
          shopt -s nullglob
          patches=(custom/patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "没有补丁，跳过"
            exit 0
          fi
          for p in "${patches[@]}"; do
            echo "===== $p ====="
            if ! git -c core.autocrlf=false apply --check -p1 "$p"; then
              echo "::error file=$p::补丁打不上。上游很可能改动了这个文件的对应区域，需要按新代码重新生成补丁。"
              exit 1
            fi
            git -c core.autocrlf=false apply -p1 "$p"
            echo "已应用"
          done

      # -----------------------------------------------------------------------
      #  改名字 + 改包名
      #
      #  做法：先记录原始值，改完再核对，对不上就 ::error:: 停下，绝不产出
      #  「名字没改成功但看着像成功」的包。
      #
      #  防重复：包名替换是按「整体覆盖」而不是「追加后缀」，所以重复跑
      #  不会出现 com.xycz.simple_live_tv.jinx.jinx 这种叠加。
      # -----------------------------------------------------------------------
      - name: 2. 应用应用名与包名
        run: |
          set -e
          TV=simple_live_tv_app
          MF="$TV/android/app/src/main/AndroidManifest.xml"
          GR="$TV/android/app/build.gradle.kts"

          echo "===== 改动前 ====="
          grep -m1 'android:label' "$MF" || true
          grep -m1 'applicationId' "$GR" || true

          if [ -n "$APP_LABEL" ]; then
            perl -pi -e 's{(android:label=")[^"]*(")}{$1$ENV{APP_LABEL}$2}' "$MF"
          fi

          if [ -n "$APP_ID" ]; then
            perl -pi -e 's{(applicationId\s*=\s*")[^"]*(")}{$1$ENV{APP_ID}$2}' "$GR"
          fi

          echo "===== 改动后 ====="
          NEW_LABEL=$(sed -n 's/.*android:label="\([^"]*\)".*/\1/p' "$MF" | head -1)
          NEW_ID=$(sed -n 's/^[[:space:]]*applicationId = "\(.*\)".*/\1/p' "$GR" | head -1)
          echo "显示名 : $NEW_LABEL"
          echo "包名   : $NEW_ID"

          echo "===== 核对 ====="
          if [ -n "$APP_LABEL" ] && [ "$NEW_LABEL" != "$APP_LABEL" ]; then
            echo "::error::显示名没改成 $APP_LABEL（实际：$NEW_LABEL），上游可能改了 manifest 写法，请检查第 2 步"
            exit 1
          fi
          if [ -n "$APP_ID" ] && [ "$NEW_ID" != "$APP_ID" ]; then
            echo "::error::包名没改成 $APP_ID（实际：$NEW_ID），上游可能改了 gradle 写法，请检查第 2 步"
            exit 1
          fi
          echo "两项都已按预期生效"

      - name: 3. 还原签名（配了 secret 才生效）
        if: env.KS != ''
        run: |
          printf '%s' "$KS" | base64 -d > simple_live_tv_app/android/release-keystore.jks
          printf 'storeFile=../release-keystore.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' \
            "$SP" "$KP" "$KA" > simple_live_tv_app/android/key.properties

      - name: 4. Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: 5. Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          cache: true

      - name: 6. 拉依赖
        run: |
          cd simple_live_tv_app
          flutter pub get

      - name: 7. 编译 APK
        run: |
          cd simple_live_tv_app
          flutter build apk --release --split-per-abi

      - name: 7b. 核对签名（确认真的用了你的密钥）
        env:
          EXPECT: ${{ secrets.TV_CERT_SHA256 }}
        run: |
          set -e
          APK=simple_live_tv_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          INFO=$("$BT/apksigner" verify --print-certs "$APK")
          echo "$INFO"
          GOT=$(echo "$INFO" | sed -n 's/.*certificate SHA-256 digest: *//p' | tr -d ' \r' | tr 'a-f' 'A-F' | head -1)
          echo "实际签名证书 SHA-256 : $GOT"
          if echo "$INFO" | grep -qi "CN=Android Debug"; then
            echo "::error::检出的是 Android Debug 证书，签名密钥没有生效"
            exit 1
          fi
          if [ -n "$EXPECT" ]; then
            if [ "$GOT" != "$EXPECT" ]; then
              echo "::error::签名证书不匹配（期望 $EXPECT）"
              exit 1
            fi
            echo "签名证书与预期一致"
          else
            echo "未配置 TV_CERT_SHA256，仅做 debug 证书排除检查"
          fi

      - name: 7c. 核对内置字体（确认 MiSans 真的进了包）
        run: |
          set -e
          APK=simple_live_tv_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          echo "APK 体积: $(du -h "$APK" | cut -f1)"
          echo "--- 包内字体资源 ---"
          LIST=$(unzip -l "$APK" | grep -i "flutter_assets/assets/fonts/" || true)
          echo "${LIST:-（无）}"
          for f in MiSans-Regular.ttf MiSans-Bold.ttf; do
            if ! echo "$LIST" | grep -q "$f"; then
              echo "::error::APK 里没有 $f，字体没有被打包进去"
              exit 1
            fi
          done
          echo "两个 MiSans 字重均已打包"

      - name: 8. 存到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jinx-tv-apk
          path: simple_live_tv_app/build/app/outputs/flutter-apk/app-*-release.apk

      - name: 9. 读版本号
        id: ver
        run: |
          V=$(python3 -c "import json;print(json.load(open('assets/tv_app_version.json'))['version'])")
          echo "v=$V" >> "$GITHUB_OUTPUT"

      - name: 10. 打时间戳
        id: stamp
        run: echo "d=$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: 11. 发到 Releases
        id: rel
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "jinx_v${{ steps.ver.outputs.v }}-${{ steps.stamp.outputs.d }}"
          name: "Jinx Live TV ${{ steps.ver.outputs.v }} (${{ steps.stamp.outputs.d }})"
          body: |
            来源提交 ${{ github.sha }}
            包名 ${{ env.APP_ID }}
          prerelease: true
          files: |
            simple_live_tv_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            simple_live_tv_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_tv_app/build/app/outputs/flutter-apk/app-x86_64-release.apk

      # -----------------------------------------------------------------------
      #  邮件通知：新包已发布 → 发一封带直链的邮件
      #  发不出去只告警，不让构建失败（包已经在 Releases 里了）
      # -----------------------------------------------------------------------
      - name: 12. 发邮件通知
        if: env.MU != '' && env.MC != '' && env.MT != ''
        env:
          TAG: jinx_v${{ steps.ver.outputs.v }}-${{ steps.stamp.outputs.d }}
          VER: ${{ steps.ver.outputs.v }}
          STAMP: ${{ steps.stamp.outputs.d }}
          SOURCE: ${{ github.event.inputs.source }}
        run: |
          python3 - <<'PY'
          import os, smtplib, ssl, subprocess, datetime
          from email.message import EmailMessage
          from email.utils import formatdate, make_msgid

          user = os.environ["MU"]; code = os.environ["MC"]; to = os.environ["MT"]
          tag  = os.environ["TAG"]; ver = os.environ["VER"]; stamp = os.environ["STAMP"]
          src  = (os.environ.get("SOURCE") or "手动").strip()
          repo = os.environ["GITHUB_REPOSITORY"]; sha = os.environ["GITHUB_SHA"]
          subject = subprocess.run(["git", "log", "-1", "--pretty=%s"],
                                   capture_output=True, text=True).stdout.strip() or "(无提交说明)"

          # 构建时间：STAMP 是 UTC，邮件里给北京时间
          utc = datetime.datetime.strptime(stamp, "%Y%m%d-%H%M").replace(tzinfo=datetime.timezone.utc)
          bj  = utc.astimezone(datetime.timezone(datetime.timedelta(hours=8)))
          when = bj.strftime("%Y-%m-%d %H:%M")

          base = f"https://github.com/{repo}/releases/download/{tag}"
          rel  = f"https://github.com/{repo}/releases/tag/{tag}"
          outdir = "simple_live_tv_app/build/app/outputs/flutter-apk"
          apks = [
              ("app-arm64-v8a-release.apk",   "arm64-v8a",   "大多数 64 位电视 / 电视盒子，优先下这个"),
              ("app-armeabi-v7a-release.apk", "armeabi-v7a", "较老的 32 位电视设备"),
              ("app-x86_64-release.apk",      "x86_64",      "模拟器 / x86 设备"),
          ]

          rows = []
          for name, abi, desc in apks:
              p = os.path.join(outdir, name)
              size = f"{os.path.getsize(p) / 1048576:.2f} MB" if os.path.exists(p) else "未产出"
              rows.append((abi, size, desc, f"{base}/{name}"))

          text = [f"Jinx Live TV {ver} 已构建完成", f"构建时间：{when}（北京时间）",
                  f"触发来源：{src}", f"提交：{sha[:8]} {subject}", "", "下载："]
          text += [f"- {abi}  {size}  {url}" for abi, size, _, url in rows]
          text += ["", f"发布页：{rel}", "包名：com.xycz.simple_live_tv.jinx",
                   "签名核对：通过（不是 debug 签名）", "内置字体核对：MiSans 已打包", "",
                   "邮件由 GitHub Actions 自动发送，发不出去不影响构建。"]

          html_rows = "".join(
              f'<tr><td style="padding:8px 10px;border-bottom:1px solid #eee;white-space:nowrap">'
              f'<b>{abi}</b></td>'
              f'<td style="padding:8px 10px;border-bottom:1px solid #eee;white-space:nowrap">{size}</td>'
              f'<td style="padding:8px 10px;border-bottom:1px solid #eee;color:#555">{desc}</td>'
              f'<td style="padding:8px 10px;border-bottom:1px solid #eee">'
              f'<a href="{url}" style="color:#1a73e8">下载</a></td></tr>'
              for abi, size, desc, url in rows)
          html = f"""<div style="font-family:-apple-system,Segoe UI,Microsoft YaHei,sans-serif;font-size:14px;color:#222;line-height:1.7">
          <h2 style="margin:0 0 12px;font-size:18px">Jinx Live TV {ver} 已构建完成</h2>
          <p style="margin:0 0 4px">构建时间：<b>{when}</b>（北京时间）</p>
          <p style="margin:0 0 4px">触发来源：<b>{src}</b></p>
          <p style="margin:0 0 16px">提交：<code>{sha[:8]}</code> {subject}</p>
          <table style="border-collapse:collapse;font-size:13px">
            <tr style="background:#f6f8fa"><th style="padding:8px 10px;text-align:left">架构</th>
            <th style="padding:8px 10px;text-align:left">体积</th>
            <th style="padding:8px 10px;text-align:left">适用</th>
            <th style="padding:8px 10px;text-align:left">直链</th></tr>
            {html_rows}
          </table>
          <p style="margin:16px 0 4px">包名 <code>com.xycz.simple_live_tv.jinx</code>（可覆盖升级）</p>
          <p style="margin:0 0 4px">签名核对：<b>通过</b>（非 debug 签名）　字体核对：<b>MiSans 已打包</b></p>
          <p style="margin:12px 0 0"><a href="{rel}" style="color:#1a73e8">打开发布页</a></p>
          <p style="margin:16px 0 0;color:#888;font-size:12px">此邮件由 GitHub Actions 自动发送。</p>
          </div>"""

          msg = EmailMessage()
          msg["Subject"] = f"[Jinx Live] 新包 {ver} ({when})"
          msg["From"] = user
          msg["To"] = to
          msg["Date"] = formatdate(localtime=True)
          msg["Message-ID"] = make_msgid()
          msg.set_content("\n".join(text))
          msg.add_alternative(html, subtype="html")

          try:
              with smtplib.SMTP_SSL("smtp.qq.com", 465, timeout=30,
                                    context=ssl.create_default_context()) as s:
                  s.login(user, code)
                  s.send_message(msg)
              print(f"邮件已发送：{to}")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
                  f.write(f"\n- 邮件通知：已发送至 {to}\n")
          except Exception as e:
              print(f"::warning::邮件发送失败（不影响构建）：{type(e).__name__}: {e}")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
                  f.write(f"\n- 邮件通知：**发送失败** {type(e).__name__}: {e}\n")
          PY
