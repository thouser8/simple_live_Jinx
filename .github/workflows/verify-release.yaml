# =============================================================================
#  发布件自检（手动触发，约 1 分钟）
#
#  作用：把 Releases 里最新的 TV 安装包下载到运行机，直接读出里面的
#  真实包名、显示名、签名证书。这是对「已发布成品」的检查，不是对源码的检查。
#
#  为什么不放在打包流程里：打包流程里的核对验证的是「代码改对了」，
#  这里验证的是「装到电视上的那个文件确实是这样」。
# =============================================================================
name: Verify Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 取最新 Release 的 arm64 包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=1" -q '.[0].tag_name')
          echo "tag = $TAG"
          curl -sL -o app.apk \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/app-arm64-v8a-release.apk"
          ls -l app.apk

      - name: 2. 读包名 / 显示名 / 版本
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "===== badging ====="
          "$BT/aapt2" dump badging app.apk > badging.txt || "$BT/aapt" dump badging app.apk > badging.txt
          head -1 badging.txt
          grep -m1 "^application-label:" badging.txt || true
          PKG=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" badging.txt | head -1)
          echo "PACKAGE=$PKG"
          echo "PACKAGE=$PKG" >> "$GITHUB_ENV"

      - name: 3. 读签名证书
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs app.apk | tee sig.txt
          if grep -qi "CN=Android Debug" sig.txt; then
            echo "::error::这个包是 debug 签名的"
            exit 1
          fi

      - name: 4. 汇总
        run: |
          echo "### 发布件自检结果" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          head -1 badging.txt >> "$GITHUB_STEP_SUMMARY"
          grep -m1 "^application-label:" badging.txt >> "$GITHUB_STEP_SUMMARY" || true
          grep "certificate DN\|SHA-256 digest" sig.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
