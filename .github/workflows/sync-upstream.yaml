# =============================================================================
#  Sync Upstream —— 每周从 June6699/dart_simple_live 同步一次
#
#  【为什么不会冲突】
#    你的仓库和上游共享同一套提交历史（建线时就是用完整克隆接上的）。
#    你独有的新增文件：.github/workflows/ 下的两个工作流、custom/patches/ 下
#    的补丁文件，上游都没有，永远不会被改。
#
#  【README.md 特例】
#    本仓库首页 README.md 已重写（只保留协议、引用、鸣谢、声明），与上游不同。
#    上游一旦改 README.md 就会冲突，所以同步时先合并、后强制把 README.md
#    恢复成我们自己的版本再提交：README 永远听你的，其余文件照常跟上上游。
#
#  【万一真的冲突了会怎样】
#    只有 README.md 允许冲突；其它文件只要冲突就立刻 git merge --abort，
#    仓库一个字节都不改，然后报错让你手动处理。
#
#  【时间】
#    每周一 03:00 UTC = 北京时间 11:00
#    也可以随时在 Actions 页面手动点 Run workflow
# =============================================================================
name: Sync Upstream (同步 June6699)

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  UPSTREAM: https://github.com/June6699/dart_simple_live.git
  # 同步到新代码后是否自动打一个 TV 包（不需要就改成 false）
  AUTO_BUILD: "true"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 签出（要完整历史才能合并）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. 合并上游
        id: merge
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "$UPSTREAM" 2>/dev/null || git remote set-url upstream "$UPSTREAM"
          git fetch --quiet upstream master

          BEFORE=$(git rev-parse HEAD)
          BEHIND=$(git rev-list --count HEAD..upstream/master)
          echo "落后上游 $BEHIND 个提交" | tee -a "$GITHUB_STEP_SUMMARY"

          if [ "$BEHIND" = "0" ]; then
            echo "上游没有新提交，无需同步。" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 先记录「本仓库主动删掉的路径」，合并后要一直保持删除
          REMOVED_LIST=custom/removed-paths.txt
          removed_paths() {
            [ -f "$REMOVED_LIST" ] || return 0
            grep -v '^[[:space:]]*#' "$REMOVED_LIST" | sed '/^[[:space:]]*$/d'
          }

          # 判断某个冲突文件是否属于「预期冲突」：README.md 或主动删除的路径
          is_expected() {
            local f="$1" p
            [ "$f" = "README.md" ] && return 0
            while IFS= read -r p; do
              [ -z "$p" ] && continue
              case "$f" in "$p"|"$p"/*) return 0 ;; esac
            done < <(removed_paths)
            return 1
          }

          # 先合并但不提交：README.md / 已删路径的冲突属于预期情况，交给下面统一处理
          set +e
          git merge --no-commit --no-ff upstream/master
          MERGE_RC=$?
          set -e

          if [ "$MERGE_RC" != "0" ]; then
            BAD=""
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              is_expected "$f" || BAD="$BAD $f"
            done < <(git diff --name-only --diff-filter=U)
            if [ -n "$BAD" ]; then
              echo "::error::上游改动与以下文件冲突：$BAD，本次同步已放弃，仓库未被修改。"
              echo "**冲突**：$BAD，已放弃本次合并，仓库保持原样。" >> "$GITHUB_STEP_SUMMARY"
              git merge --abort
              exit 1
            fi
            echo "冲突仅出现在 README.md 或已删除路径上，按约定保留本仓库现状。" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          # 1) README.md 一律用我们自己的版本
          git checkout HEAD -- README.md
          git add README.md

          # 2) 主动删除的路径：上游即使改了/恢复了，也重新删掉
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            git rm -r -q --ignore-unmatch --cached -- "$p" >/dev/null 2>&1 || true
            rm -rf -- "$p"
          done < <(removed_paths)
          git add -A

          git commit --no-edit

          git push origin HEAD:master
          echo "已同步：$BEFORE → $(git rev-parse --short HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 3. 有新代码就打一个 TV 包
        if: steps.merge.outputs.changed == 'true' && env.AUTO_BUILD == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 打上来源标记，构建完的邮件里会写明是「自动同步」触发的
          gh workflow run My-TV-Build.yaml --ref master -f source="自动同步" --repo "$GITHUB_REPOSITORY"
          echo "已触发 TV 构建，出包后会自动发邮件通知。" | tee -a "$GITHUB_STEP_SUMMARY"
